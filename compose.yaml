# Usage: docker compose --env-file .env up -d  (add -f compose.local.yaml for local CA; see certs/README.md)
services:
  app:
    image: ${VOX_IMAGE:-vox-mi-agent:dev}
    container_name: vox-mi-agent
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "${VOX_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      APP_BASE_PATH: ""
      VOX_LLM_PROVIDER: ${VOX_LLM_PROVIDER:-custom}
      VOX_LLM_MODEL: ${VOX_LLM_MODEL:-}
      VOX_LLM_API_KEY: ${VOX_LLM_API_KEY:-}
      VOX_PUBLIC_BASE_URL: ${VOX_PUBLIC_BASE_URL:-}
    command: ["serve", "--listen", "tcp://0.0.0.0:8080", "--data", "/data"]
    volumes:
      - ${VOX_DATA:-./data}:/data
      # Music library (read-only). Set VOX_MUSIC in .env for local testing; on fnOS use an authorised share path.
      - ${VOX_MUSIC:-./music}:/music:ro
