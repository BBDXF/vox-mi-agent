# vox-mi-agent default configuration (generated on first start).
# Priority: built-in defaults -> this file -> VOX_* environment variables.
# Keys omitted here fall back to built-in defaults. This file is mode 0600
# because it may contain llm.api_key; prefer VOX_LLM_API_KEY in compose.

server:
  listen: "tcp://127.0.0.1:8080"      # or "unix:///data/app.sock"
  base_path: "/app/vox"               # sub path; "/" redirects here
  auth:
    require_admin: false

llm:
  provider: "custom"                  # opencode-zen|deepseek|dashscope|openai|ollama|custom
  base_url: "https://api.openai.com/v1"
  api_key: ""                         # prefer env VOX_LLM_API_KEY
  model: "gpt-4o-mini"
  temperature: 0.3
  timeout: 60s
  # extra_body:                       # merged into the chat/completions request JSON
  #   enable_thinking: false          # (siliconflow/dashscope presets default to this)

tools:
  # dir: /usr/local/bin               # VOX_TOOLS_DIR; fzq/jq/yq default to <dir>/<name>
  # fzq_path: /usr/local/bin/fzq
  # jq_path: /usr/local/bin/jq
  # yq_path: /usr/local/bin/yq
  shell:
    enabled: false
    isolation: landlock
    expose_to: admin_console          # admin_console | all
    timeout: 10s
    max_output: 64KiB
    readable_paths: []

# Registered data sources for fuzzy_match / query_json / query_yaml.
# file is relative to <dataDir>/sources unless absolute.
sources: []
#  - name: contacts
#    file: contacts.json
#    format: json                     # json | jsonl | yaml
#    records: ".contacts"             # default records path
#    keys: [name, nickname]
#    extract: ""
#    strip: []

media:
  folders: ["/vol1/1000/Music"]
  extensions: [mp3, flac, m4a, aac, wav, ogg, ape]
  sync_interval: 6h                   # 0 = manual only
  sync_on_start: true
  max_files: 100000
  filename_pattern: '(?:(?P<artist>[^/]+?) - )?(?P<title>[^/]+)\.\w+$'
  tag_mode: filename_first            # filename_first | tags_first | filename_only

search:
  strip_patterns:
    - '^(下一首|上一首|暂停|播放音乐)$'
    - '^(小爱同学|小度)?[，, ]*(请|帮我)?(播放|放|来|我想听|我要听|想听|听)(一下|一首|首|点)?'
    - '(的歌|吧|呀)$'
  min_score: 65
  limit: 5
  candidates: 500

speaker:
  driver: mock                        # mock | xiaomi
  debug_device: true                  # always-available mock device "debug" (调试音箱)
  volume_default: 30                  # default for the volume test action; 0 = unset (never applied automatically)
  xiaomi:
    devices: []                       # {device_id, name, hardware, enabled, play_mode: auto|url|music, tts_mode: auto|mina|miot, miot_tts: "5-1"}
  hook:
    mode: music                       # music | keyword | all | off
    wake_words: ["小爱同学", "小爱"]    # stripped from the start of every ask
    music_triggers: ["播放", "放一首", "放首", "放一下", "放", "来一首", "来首", "来点", "我想听", "想听", "听一下", "听听", "听"]
    music_exclude: ["放假", "放心", "放松", "听说", "听话", "听见"]
    direct_play_score: 85             # search score (1-100) to play without the LLM
    keywords: ["问问"]                  # prefixes for mode keyword
    poll_interval: 1s                 # 500ms - 5s
    interrupt_window: 3s
  mock:
    latency_ms: 0
    fail_rate: 0

logging:
  level: info                         # debug | info | warn | error
  trace_retention_days: 30            # traces table (per-turn/LLM/tool timings)
  trace_max_rows: 100000
  debug_payloads: false               # write full LLM request/response + tool results to <data>/logs
  payload_retention_days: 7
  payload_max_bytes: 200MiB
