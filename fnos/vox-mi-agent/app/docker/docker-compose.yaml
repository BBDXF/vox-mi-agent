services:
  app:
    image: ghcr.io/bbdxf/vox-mi-agent:${VOX_VERSION}
    container_name: vox-mi-agent
    restart: unless-stopped
    user: "${TRIM_UID:-1000}:${TRIM_GID:-1000}"
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "${TRIM_SERVICE_PORT:-18080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      VOX_PUBLIC_BASE_URL: ${VOX_PUBLIC_BASE_URL:-}
      VOX_BASE_PATH: /app/vox
    command: ["serve", "--listen", "tcp://0.0.0.0:8080", "--data", "/data"]
    volumes:
      - ${TRIM_PKGVAR:?}/data:/data
      - ${VOX_MUSIC}:/music:ro
