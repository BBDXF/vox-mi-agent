name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        if: ${{ hashFiles('web/package.json') != '' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: make web

      - name: Cross-compile (linux amd64 + arm64)
        # `make build` re-runs `make web` (idempotent); binaries land in dist/linux_<arch>/app
        run: make build VERSION="${VERSION}" COMMIT="${GITHUB_SHA::7}"

      - name: Build fnOS package (.fpk)
        run: |
          sudo curl -fsSL -o /usr/local/bin/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          sudo chmod +x /usr/local/bin/fnpack
          sh fnos/build.sh "${GITHUB_REF_NAME}"
          mkdir -p release && cp dist/fpk/*.fpk release/

      - name: Package release assets
        run: |
          mkdir -p release
          for arch in amd64 arm64; do
            tar -C "dist/linux_${arch}" -czf "release/app_${VERSION}_linux_${arch}.tar.gz" app
          done
          (cd release && sha256sum ./*.tar.gz ./*.fpk | sed 's#\./##' > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Release notes (CHANGELOG section + commits)
        run: |
          tag="${GITHUB_REF_NAME}"
          awk -v h="## ${tag}" '$0==h{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "_CHANGELOG.md 中没有 ${tag} 一节。_" > notes.md
          prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          {
            echo; echo "### 提交记录"; echo
            git log --no-merges --format='- %s (%h)' ${prev:+$prev..}"${tag}"
            [ -n "$prev" ] && { echo; echo "**完整对比**：https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"; }
          } >> notes.md
          cat notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.tar.gz
            release/*.fpk
            release/SHA256SUMS.txt
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 -> 1.2.3, 1.2, latest (latest/1.2 skipped for pre-releases like v1.2.3-rc1)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=vox-mi-agent
            org.opencontainers.image.description=Self-hosted AI agent for Xiaomi speakers with local music library
            org.opencontainers.image.licenses=MIT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
