name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        if: ${{ hashFiles('web/package.json') != '' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: make web

      - name: Embed web UI into Go package
        run: |
          if [ -d web/dist ]; then
            rm -rf internal/webui/dist
            mkdir -p internal/webui
            cp -r web/dist internal/webui/dist
          fi

      - name: Cross-compile (linux amd64 + arm64)
        # `make build` re-runs `make web` (idempotent); binaries land in dist/linux_<arch>/app
        run: make build VERSION="${VERSION}"

      - name: Package release assets
        run: |
          mkdir -p release
          for arch in amd64 arm64; do
            tar -C "dist/linux_${arch}" -czf "release/app_${VERSION}_linux_${arch}.tar.gz" app
          done
          (cd release && sha256sum ./*.tar.gz | sed 's#\./##' > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/SHA256SUMS.txt
          generate_release_notes: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:latest
