name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      VOX_TOOLS_DIR: ${{ github.workspace }}/.tools
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Fetch pinned tools
        run: ./scripts/fetch-tools.sh .tools
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:" >&2
            echo "$out" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: build (with build info)
        run: |
          BI=github.com/BBDXF/vox-mi-agent/internal/buildinfo
          go build -trimpath -ldflags "-X $BI.Version=ci -X $BI.Commit=${GITHUB_SHA::7} -X $BI.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o /tmp/app ./cmd/app
          /tmp/app version

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build test image (empty extra-ca.crt in CI)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          push: false
          tags: vox-mi-agent:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run tests in container
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e VOX_TOOLS_DIR=/usr/local/bin \
            vox-mi-agent:test go test -count=1 ./...
